[fluid-description]
ipp-industrial-steam=High-pressure steam for turbine-generators. 1 unit carries __1__ kJ. Stays at normal temperature; its energy is a fuel value, so it connects to any steam turbine port.
ipp-exhaust-steam=Spent turbine steam. Condense it back into water or vent it.
ipp-fuel-gas=Conditioned petroleum gas. 1 unit burns for __1__ MJ.
ipp-hot-exhaust=Gas turbine exhaust with recoverable heat. Send it to a heat-recovery steam generator, or vent it.
ipp-flue-gas=Cooled exhaust with no recoverable heat. Vent it with an exhaust stack.

