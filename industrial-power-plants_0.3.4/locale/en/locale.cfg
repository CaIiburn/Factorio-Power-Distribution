[item-description]
ipp-coal-charge=Eight coal pressed into one standardised fuel charge (32 MJ). Same energy as the coal it was made from; burns to ash.
ipp-ash=Inert residue from burning graded coal. Compact it or use it in concrete.
ipp-ash-block=Twenty units of ash, compacted for storage or disposal.

