[entity-description]
ipp-coal-mill=Presses coal into graded charges. Needs power: a blackout stops fuel preparation, so keep a small vanilla boiler set for black starts.
ipp-industrial-boiler=13.2 MW. Burns graded coal charges only and leaves ash, which must be removed or the boiler stops. Feeds two steam turbine-generators.
ipp-steam-turbine-generator=Consumes up to 132 industrial steam/s for 6.5 MW and returns exhaust steam. Draws steam only as fast as the grid takes power.
ipp-air-condenser=Condenses up to 270 exhaust steam/s back to 260 water/s. Optional: exhaust stacks can vent instead.
ipp-exhaust-stack=Picks its vent recipe automatically from the fluid arriving at its inlet (north face when unrotated). Vents only exhaust steam, flue gas and hot exhaust; valuable, fuel and hazardous fluids are refused. Run /ipp-vent-list for the list.
ipp-waste-compactor=Compacts ash into storable blocks.
ipp-fuel-gas-conditioner=Compressor train: turns 105 petroleum gas/s into 84 fuel gas/s. Draws 4 MW and produces the plant's combustion pollution. Needs power to run.
ipp-gas-turbine-generator=Burns up to 84 fuel gas/s for 45.4 MW and returns hot exhaust for heat recovery. Alone it is far less efficient than with a heat-recovery stage. Needs conditioned fuel gas, which needs grid power: keep a startup bank.
ipp-heat-recovery-steam-generator=Turns 84 hot exhaust/s and 450 water/s into 450 industrial steam/s for a large steam turbine-generator, leaving flue gas.
ipp-large-steam-turbine-generator=Consumes up to 450 industrial steam/s for 22.2 MW and returns exhaust steam. Pairs with one heat-recovery steam generator.
ipp-startup-bank=200 MJ reserve that supplies bootstrap power and shutdown reserve.

