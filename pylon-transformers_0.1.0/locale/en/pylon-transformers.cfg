pt-transformers-3=Transformers (large)

[technology-description]
pt-transformers-1=Step-up and step-down transformers for long-distance power lines.
pt-transformers-2=Step-up and step-down transformers for long-distance power lines.
pt-transformers-3=Step-up and step-down transformers for long-distance power lines.

[pt-tooltip]
max-output=Maximum output power
idle-loss=Idle loss
conv-loss=Conversion loss (of output)
line-loss=Line loss per 1000 tiles (of output)

[mod-setting-name]
pt-update-interval=Transformer update interval (ticks)

[mod-setting-description]
pt-update-interval=How often the transfer script runs per transformer. Higher is cheaper but needs larger buffers (handled automatically). Requires restart.

