[entity-description]
pt-radiator=Cools heat pipes and heat transformers it is connected to. Put it on a transformer's long side or on a heat pipe.
pt-up=Feeder network in, pylon line out. The output end is where it faces.
pt-down=Pylon line in, distribution network out. The output end is where it faces.
pt-power=Wire the ports on its short ends to poles of their own class. Not allowed in a pole's supply area.
pt-circuit=Circuit: load (%) and power (kW).
pt-heat=Losses heat it up: cool it with heat pipes or radiators on the long sides. Explodes when too hot.

[virtual-signal-name]
pt-load=Transformer load (%)
pt-power=Transformer power (kW)
pt-temperature=Transformer temperature (°C)

[pt-item-name]
transformer=Transformer (T__1__)

[item-description]
pt-choose-size=Step-up or step-down, small, medium or large: place it, then open it to choose. Shift + right click copies the choice, Shift + left click pastes it onto another transformer.

