[entity-description]
pt-up=Left side takes power from the generating network, right side feeds the pylon line. Idle and conversion losses apply.
pt-down=Left side takes power from the pylon line, right side feeds the consuming network. Idle, conversion and line losses apply. Can only be built on a pylon line that has a step-up transformer.

