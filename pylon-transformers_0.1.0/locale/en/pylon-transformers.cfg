[mod-setting-description]
pt-update-interval=How often the transfer script runs per transformer. Higher is cheaper but needs larger buffers (handled automatically). Requires restart.
pt-explosions=Tier 3 and 4 transformers explode and damage their surroundings when they reach their explosion temperature. When off they still heat up and raise alerts.

[pt-message]
in-pole-area=Transformers cannot be built inside the supply area of an electric pole.
no-step-up=No step-up transformer is reachable on this pylon line.
overheating=Transformer overheating: __1__ °C
exploded=A transformer overheated and exploded at __1__.
