[entity-description]
pt-up=Takes power from the generating network at its input end and feeds the pylon line at its output end (facing north: input on the left, output on the right). Idle and conversion losses apply.
pt-down=Takes power from the pylon line at its input end and feeds the consuming network at its output end (facing north: input on the left, output on the right). Idle, conversion and line losses apply. Can only be built on a pylon line that has a step-up transformer.
pt-power=Connect it to the grid with copper wire at the connection points on its short ends. Cannot be built inside the supply area of an electric pole.
pt-circuit=Connect a circuit wire to read the delivered load (%) and power (kW). Updated every few ticks.
pt-heat=Losses heat it up. Connect heat pipes to the long sides to cool it. Also reports its temperature on the circuit network. Explodes when it gets too hot.

