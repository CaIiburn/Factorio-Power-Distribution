desc-feeder=Collects power from generators. Its supply area may not touch power consumers or transformers. Only wires to other feeder poles and transformer inputs.
desc-pylon=Long-distance line with no supply area. Only wires to other pylons and transformer ports. A pylon line may have at most two transformer outputs.
desc-distribution=Delivers power to consumers. Its supply area may not touch power producers or transformers. Only wires to other distribution poles and transformer outputs. A network may have at most two transformer outputs.
desc-aux=Small isolated network for power plant auxiliaries (inserters, pumps) fed by the plant's own solar panels, accumulators or interfaces. Only wires to other auxiliary poles. May not touch transformers.
