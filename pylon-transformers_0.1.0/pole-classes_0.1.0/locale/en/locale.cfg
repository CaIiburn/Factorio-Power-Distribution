[mod-setting-description]
pc-network-cap-multiplier=Scales the pole limit of every network. Requires a restart.
pc-enforce-script-built=When off, entities created by other mods are only reported, never removed. Requires a restart.
pc-autowire-mode=chain: continue the line you are building. nearest: join the nearest open pole end. off: wire by hand.
pc-show-zones=Draws red areas where the pole in your hand must not be placed.
pc-zone-radius=How far around you the restricted areas are drawn, in tiles.

