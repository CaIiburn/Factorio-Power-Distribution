[fluid-description]
ipp-industrial-steam=High-pressure steam for turbine-generators. 1 unit carries __1__ kJ. Stays at normal temperature; its energy is a fuel value, so it connects to any steam turbine port.
ipp-exhaust-steam=Spent turbine steam. Condense it back into water or vent it.
ipp-fuel-gas=Conditioned petroleum gas. 1 unit burns for __1__ MJ.
ipp-hot-exhaust=Gas turbine exhaust with recoverable heat. Send it to a heat-recovery steam generator, or vent it.
ipp-flue-gas=Cooled exhaust with no recoverable heat. Vent it with an exhaust stack.
ipp-primary-water=Radioactive coolant of the closed primary loop. Circulates between the reactor's circulation unit and the nuclear steam generator and must never be vented. Made from water in a water treatment plant; the loop loses none of it.
ipp-primary-water-hot=Primary water heated by the reactor core. Goes to the nuclear steam generator and comes back cool.
ipp-secondary-water=Feed fluid of the closed secondary loop. Runs from the surface condenser to the nuclear steam generator, where it becomes high-pressure steam, and returns as exhaust steam condensate. Made from water in a water treatment plant; the loop loses none of it.
ipp-hp-steam=Steam from a nuclear steam generator for the high-pressure turbine train. 1 unit carries __1__ kJ.
ipp-cooling-water=Cool water of the cooling circuit: takes heat from the surface condenser. Made from water in a water treatment plant; the circuit itself loses none of it (the cooling tower evaporates separate makeup water).
ipp-cooling-water-warm=Warm cooling water. Send it to a cooling tower or dry cooler.
ipp-solvent=Organic solvent for nuclear reprocessing.
ipp-primary-sodium=Radioactive (activated) sodium coolant of the primary loop of a fast breeder. Circulates between the reactor's sodium circulation units and the intermediate sodium exchanger and must never be vented. Made in a sodium electrolyzer; the loop loses none of it.
ipp-primary-sodium-hot=Primary sodium heated by the reactor core. Goes to the intermediate sodium exchanger and comes back cool.
ipp-secondary-sodium=Non-radioactive sodium of the secondary loop: the second isolation barrier between the reactor and the CO2 cycle. Runs between the intermediate exchanger and the CO2 heater. Made in a sodium electrolyzer; the loop loses none of it.
ipp-secondary-sodium-hot=Secondary sodium heated by the intermediate exchanger. Goes to the sodium-to-CO2 heater and comes back cool.
ipp-chlorine=Poisonous by-product of sodium electrolysis. Neutralise it with lime or make chlorinated plastic from it; never vent it.
ipp-brine=Salt solution for making dry sodium salt. Made from water and stone.
ipp-co2=The working fluid of the CO2 cycle on its way to the compressor. The kiln makes it, and the cooler returns it. The only CO2 an exhaust stack may vent.
ipp-sco2=Cold compressed CO2 from the compressor. Send it through a recuperator to the heater; a heater fed with it directly needs much more heat per MW.
ipp-sco2-warm=Compressed CO2 that has taken heat from the turbine exhaust in a recuperator. Goes to the sodium-to-CO2 heater.
ipp-sco2-hot=Hot supercritical CO2 for a CO2 turbine-generator. 1 unit burns for __1__ MJ. Stays at normal temperature; its energy is a fuel value, so it connects to the turbine port.
ipp-sco2-exhaust=Turbine exhaust CO2 with heat left in it. Pass it through a recuperator, then the cooler.

