[entity-description]
ipp-air-condenser=Condenses up to __1__ exhaust steam/s back to __2__ water/s. Optional: exhaust stacks can vent instead.
ipp-exhaust-stack=Picks its vent recipe automatically from the fluid arriving at its inlet (north face when unrotated). Vents only exhaust steam, flue gas and hot exhaust; valuable, fuel and hazardous fluids are refused. Run /ipp-vent-list for the list.
ipp-fuel-gas-conditioner=Compressor train: turns __1__ petroleum gas/s into __2__ fuel gas/s. Draws __3__ MW and produces the plant's combustion pollution. Needs power to run.
ipp-gas-turbine-generator=Burns up to __1__ fuel gas/s for __2__ MW and returns hot exhaust for heat recovery. Alone it is far less efficient than with a heat-recovery stage. Needs conditioned fuel gas, which needs grid power: keep a startup bank.
ipp-heat-recovery-steam-generator=Turns __1__ hot exhaust/s and __2__ water/s into __3__ industrial steam/s for a large steam turbine-generator, leaving __4__ flue gas/s.
ipp-large-steam-turbine-generator=Consumes up to __1__ industrial steam/s for __2__ MW and returns exhaust steam. Pairs with one heat-recovery steam generator.
ipp-startup-bank=__1__ MJ reserve that supplies bootstrap power and shutdown reserve.
ipp-pwr-reactor-core=Burns fuel assemblies for up to __1__ MW of heat (cores next to each other boost each other, as in the base game). The control rods follow the circuit network: set Control-rod withdrawal (0-100 %) to choose the power, send Reactor SCRAM to drive them all the way in at __6__ %/s, even if the signal is only a pulse; the rods then stay in and cannot be withdrawn for __7__ min. Without a wire it drops them by itself (no lockout). Rods move at __5__ %/s. The core keeps making afterheat after shutdown. If it makes more heat than the circulation units carry away it overheats: warning at __2__ °C, and above __3__ °C for __4__ s it explodes. Turn on "read temperature" in the circuit settings to see the core temperature. Needs primary circulation units touching it or connected by heat pipes.
ipp-primary-circulation-unit=Takes up to __1__ MW of heat from the reactor core and heats __2__ primary water/s to __3__ °C for the nuclear steam generator. Only draws heat while the core is above __4__ °C. Pipe it in a closed loop with the steam generator: cool water in at either side, hot water out at the top, heat connection at the bottom.
ipp-nuclear-steam-generator=Passes the heat of __1__ hot primary water/s to __2__ secondary water/s and makes __3__ high-pressure steam/s, returning the primary water cool. Draws __4__ MW for its pumps: without power the primary loop stops and the core loses its cooling. Ports facing north: hot primary water (left) and secondary water (right) in; steam (left) and cool primary water (right) out.
ipp-hp-turbine-generator=Burns up to __1__ high-pressure steam/s for __2__ MW and returns exhaust steam for the surface condenser.
ipp-surface-condenser=Condenses __1__ exhaust steam/s into secondary water using __2__ cooling water/s, which leaves warm. Ports facing north: exhaust steam (left) and cool cooling water (right) in; secondary water (left) and warm cooling water (right) out.
ipp-cooling-tower=Cools up to __1__ warm cooling water/s by evaporation and consumes __2__ water/s (ordinary water, not cooling water) while it does, so build it next to a water supply. Ports facing north: warm cooling water (left) and water (right) in; cool cooling water out.
ipp-dry-cooler=Cools up to __1__ warm cooling water/s with fans (__2__ MW) and needs no water.
ipp-spent-fuel-pool=Cools one hot spent fuel assembly in __1__ s using __2__ water per assembly. Insert hot assemblies, take cooled ones.
ipp-water-treatment-plant=Treats water for the three closed loops of the pressurized-water plant. Choose a recipe: __1__ water/s into primary water, __2__ water/s into secondary water, or __3__ water/s into cooling water. The loops lose nothing in operation, so the plant only fills them. Draws __4__ kW. Water in at the north face, treated water out at the south face (unrotated), both half a tile left of centre.
ipp-dry-cask-storage=Passive storage with __1__ slots for cooled spent fuel and vitrified waste.
ipp-reprocessing-plant=Dissolves a cooled spent fuel assembly in __2__ sulfuric acid and __3__ solvent over __1__ s, recovering uranium and plutonium-bearing material and leaving radioactive residue.
ipp-waste-vitrifier=Binds __1__ radioactive residue and __2__ glass frit into one vitrified waste canister every __3__ s.
ipp-heat-pipe-2=Heat pipe for hot reactors: conducts like a heat pipe but withstands __1__ °C instead of 1000 °C. Connects to ordinary heat pipes and replaces them in place.
ipp-fast-breeder-reactor=Sodium-cooled __8__x__8__ fast core: burns MOX or starter assemblies for up to __1__ MW of heat (cores next to each other boost each other, as in the base game; pressurized-water cores do not join in). Same control rods as the pressurized-water core: Control-rod withdrawal (0-100 %) sets the power, Reactor SCRAM drives them in at __6__ %/s and locks them for __7__ min; without a wire they drop by themselves. Afterheat continues after shutdown. Overheating: warning at __2__ °C, explosion above __3__ °C after __4__ s. Rods move at __5__ %/s. Needs sodium circulation units touching it or connected by heat pipes. Blanket irradiation channels touching it are bred at its actual fission power.
ipp-sodium-circulation-unit=Takes up to __1__ MW of heat from the fast-breeder core and heats __2__ primary sodium/s to __3__ °C for the intermediate sodium exchanger. Only draws heat while the core is above __4__ °C. Pipe it in the closed primary loop: cool sodium in, hot sodium out, heat connection at the bottom. __5__ of them feed one intermediate sodium exchanger.
ipp-blanket-channel=Holds one blanket assembly next to a fast-breeder core (touching, or within __3__ tiles). Irradiation speed follows the core's actual fission power, shared with the other loaded channels of the core: at full flux a blanket takes __1__ s, and it needs __2__ GJ of core fission energy in total. No power needed.
ipp-intermediate-sodium-exchanger=Passes the heat of __1__ hot primary sodium/s to __2__ secondary sodium/s, returning the primary sodium cool. Draws __3__ MW for its sodium pumps: without power the primary loop stops and the core loses its cooling. Ports facing north: hot primary sodium (left) and cool secondary sodium (right) in; cool primary sodium (left) and hot secondary sodium (right) out.
ipp-sodium-co2-heater=Heats CO2 with __1__ hot secondary sodium/s (__5__ MW of heat). It picks its recipe itself from the CO2 at its inlet: preheated CO2 from a recuperator gives __2__ hot CO2/s, cold CO2 straight from the compressor only __3__ hot CO2/s, so a plant without a recuperator still runs but needs far more heat per MW. Draws __4__ kW. Ports facing north: hot secondary sodium (left) and CO2 (right) in; cool secondary sodium (left) and hot CO2 (right) out.
ipp-sco2-compressor=Compresses __1__ CO2/s for the cycle. Draws __2__ MW: the cycle's own power demand, so it needs grid power to start (keep a startup bank). CO2 in at the north face, compressed CO2 out at the south face.
ipp-sco2-turbine-generator=Burns up to __1__ hot CO2/s for __2__ MW and returns turbine exhaust CO2 for the recuperator and cooler.
ipp-recuperator=Gives the heat of __1__ turbine exhaust CO2/s to __1__ compressed CO2/s (about __2__ MW), so the heater has less to add. Ports facing north: turbine exhaust (left) and compressed CO2 (right) in; exhaust (left) and preheated CO2 (right) out. Required for the rated efficiency.
ipp-sco2-cooler=Air-cooled: rejects the waste heat of up to __1__ turbine exhaust CO2/s and returns CO2 for the compressor. Fans draw __2__ MW. Needs no water.
ipp-shielded-fuel-fabricator=Makes MOX assemblies (plutonium-bearing material, depleted uranium, cladding), starter assemblies (enriched uranium, depleted uranium, cladding) and blanket assemblies (depleted uranium, cladding). Choose a recipe. Draws __1__ MW.
ipp-sodium-electrolyzer=Molten-salt electrolysis: __1__ dry sodium salt becomes __2__ sodium and __3__ chlorine every __4__ s. Choose primary-loop or secondary-loop sodium so the loops cannot be mixed up. Draws __5__ MW. Chlorine has to go somewhere: neutralise it or make chlorinated plastic. Sodium out (left) and chlorine (right) at the south face.
ipp-hot-fluid-tank=Stores __1__ units of any fluid; placed in a hot sodium or hot CO2 line it buffers heat and smooths out load changes.

