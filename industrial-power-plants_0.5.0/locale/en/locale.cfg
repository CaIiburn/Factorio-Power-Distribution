[technology-description]
ipp-industrial-steam-power=Basic power-plant components, air-cooled condensers for water recovery and exhaust stacks.
ipp-combined-cycle-power=Gas turbines whose hot exhaust raises steam for a second generation stage.
ipp-startup-energy-storage=Large-capacity reserve for black starts and controlled shutdowns.
ipp-pressurized-water-power=Three-circuit nuclear plant: a reactor core whose control rods follow circuit signals, an isolated primary loop and a separate secondary loop (both filled by a water treatment plant), steam generation, a high-pressure turbine train, cooling, and spent-fuel cooling and storage. Replaces the vanilla nuclear reactor.
ipp-nuclear-reprocessing=Recover uranium and plutonium-bearing material from cooled spent fuel and vitrify the waste.
ipp-sodium-coolant-production=Brine, dry sodium salt and molten-salt electrolysis for the two sodium loops, a kiln for lime and CO2, ways to get rid of the chlorine (neutralisation, chlorinated plastic), lime concrete and hot-fluid storage tanks.
ipp-fast-breeder-power=A sodium-cooled fast breeder with blanket irradiation, two isolated sodium loops and a recuperated supercritical-CO2 power cycle. Fuel from MOX assemblies (plutonium-bearing material and depleted uranium), or starter assemblies of enriched uranium to get the first breeder going. Spent core fuel and bred blankets are reprocessed for new plutonium-bearing material.

[fuel-category-name]
ipp-fuel-assembly=Fuel assembly
ipp-fast-fuel=Fast-reactor fuel assembly

[virtual-signal-name]
ipp-rod-withdrawal=Control-rod withdrawal (%)
ipp-scram=Reactor SCRAM

[item-description]
ipp-fuel-assembly=Burns in a pressurized-water reactor core (not in vanilla reactors). Releases __1__ GJ and leaves a hot spent assembly that must cool in a spent-fuel pool.
ipp-spent-fuel-assembly=Hot and highly radioactive. Cool it in a spent-fuel cooling pool.
ipp-spent-fuel-assembly-cooled=Safe to move. Store it in dry-cask storage or reprocess it.
ipp-plutonium-bearing-material=Recovered by reprocessing spent fuel. The fissile material of MOX assemblies for fast breeders.
ipp-radioactive-residue=High-level waste from reprocessing. Vitrify it with glass frit.
ipp-vitrified-waste-canister=Waste locked in glass. Store it in dry-cask storage.
ipp-mox-assembly=Mixed-oxide fuel for a fast-breeder core (not for pressurized-water or vanilla reactors). Releases __1__ GJ and leaves a hot spent core assembly that must cool in a spent-fuel pool.
ipp-starter-assembly=Enriched-uranium fuel that lets the first fast breeder start without any plutonium. Releases __1__ GJ and leaves a hot spent core assembly.
ipp-blanket-assembly=Depleted uranium for a blanket irradiation channel next to a running fast-breeder core. Turns into a bred blanket assembly.
ipp-bred-blanket-assembly=Irradiated blanket. Reprocess it for plutonium-bearing material, depleted uranium and waste.
ipp-spent-core-assembly=Hot and highly radioactive. Cool it in a spent-fuel cooling pool.
ipp-spent-core-assembly-cooled=Safe to move. Store it in dry-cask storage or reprocess it.
ipp-dry-sodium-salt=Dried salt from brine. Electrolysis makes sodium and chlorine from it.
ipp-lime=Quicklime from the kiln. Neutralises chlorine and makes concrete.

