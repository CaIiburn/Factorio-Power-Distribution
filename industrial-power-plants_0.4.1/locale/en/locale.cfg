[entity-description]
ipp-air-condenser=Condenses up to __1__ exhaust steam/s back to __2__ water/s. Optional: exhaust stacks can vent instead.
ipp-exhaust-stack=Picks its vent recipe automatically from the fluid arriving at its inlet (north face when unrotated). Vents only exhaust steam, flue gas and hot exhaust; valuable, fuel and hazardous fluids are refused. Run /ipp-vent-list for the list.
ipp-fuel-gas-conditioner=Compressor train: turns __1__ petroleum gas/s into __2__ fuel gas/s. Draws __3__ MW and produces the plant's combustion pollution. Needs power to run.
ipp-gas-turbine-generator=Burns up to __1__ fuel gas/s for __2__ MW and returns hot exhaust for heat recovery. Alone it is far less efficient than with a heat-recovery stage. Needs conditioned fuel gas, which needs grid power: keep a startup bank.
ipp-heat-recovery-steam-generator=Turns __1__ hot exhaust/s and __2__ water/s into __3__ industrial steam/s for a large steam turbine-generator, leaving __4__ flue gas/s.
ipp-large-steam-turbine-generator=Consumes up to __1__ industrial steam/s for __2__ MW and returns exhaust steam. Pairs with one heat-recovery steam generator.
ipp-startup-bank=__1__ MJ reserve that supplies bootstrap power and shutdown reserve.
ipp-pwr-reactor-core=Burns fuel assemblies for up to __1__ MW of heat (cores next to each other boost each other, as in the base game). The control rods follow the circuit network: set Control-rod withdrawal (0-100 %) to choose the power, send Reactor SCRAM to drop them at once. Without a wire it drops them by itself. Rods move at __5__ %/s (__6__ %/s on SCRAM). The core keeps making afterheat after shutdown. If it makes more heat than the circulation units carry away it overheats: warning at __2__ °C, and above __3__ °C for __4__ s it explodes. Turn on "read temperature" in the circuit settings to see the core temperature. Needs primary circulation units touching it or connected by heat pipes.
ipp-primary-circulation-unit=Takes up to __1__ MW of heat from the reactor core and heats __2__ primary water/s to __3__ °C for the nuclear steam generator. Only draws heat while the core is above __4__ °C. Pipe it in a closed loop with the steam generator: cool water in at either side, hot water out at the top, heat connection at the bottom.
ipp-nuclear-steam-generator=Passes the heat of __1__ hot primary water/s to __2__ feedwater/s and makes __3__ high-pressure steam/s, returning the primary water cool. Draws __4__ MW for its pumps: without power the primary loop stops and the core loses its cooling. Ports facing north: hot primary water (left) and feedwater (right) in; steam (left) and cool primary water (right) out.
ipp-hp-turbine-generator=Burns up to __1__ high-pressure steam/s for __2__ MW and returns exhaust steam for the surface condenser.
ipp-surface-condenser=Condenses __1__ exhaust steam/s into feedwater using __2__ cooling water/s, which leaves warm. Ports facing north: exhaust steam (left) and cool cooling water (right) in; feedwater (left) and warm cooling water (right) out.
ipp-cooling-tower=Cools up to __1__ warm cooling water/s by evaporation and needs __2__ makeup water/s. Ports facing north: warm cooling water (left) and makeup water (right) in; cool cooling water out.
ipp-dry-cooler=Cools up to __1__ warm cooling water/s with fans (__2__ MW) and needs no water.
ipp-spent-fuel-pool=Cools one hot spent fuel assembly in __1__ s using __2__ water per assembly. Insert hot assemblies, take cooled ones.
ipp-dry-cask-storage=Passive storage with __1__ slots for cooled spent fuel and vitrified waste.
ipp-reprocessing-plant=Dissolves a cooled spent fuel assembly in __2__ sulfuric acid and __3__ solvent over __1__ s, recovering uranium and plutonium-bearing material and leaving radioactive residue.
ipp-waste-vitrifier=Binds __1__ radioactive residue and __2__ glass frit into one vitrified waste canister every __3__ s.

