ipp-rod-withdrawal=Control-rod withdrawal (%)
ipp-scram=Reactor SCRAM

[item-description]
ipp-fuel-assembly=Burns in a pressurized-water reactor core (not in vanilla reactors). Releases __1__ GJ and leaves a hot spent assembly that must cool in a spent-fuel pool.
ipp-spent-fuel-assembly=Hot and highly radioactive. Cool it in a spent-fuel cooling pool.
ipp-spent-fuel-assembly-cooled=Safe to move. Store it in dry-cask storage or reprocess it.
ipp-plutonium-bearing-material=Recovered by reprocessing. Not used yet.
ipp-radioactive-residue=High-level waste from reprocessing. Vitrify it with glass frit.
ipp-vitrified-waste-canister=Waste locked in glass. Store it in dry-cask storage.
