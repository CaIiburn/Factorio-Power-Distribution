[technology-description]
ipp-industrial-steam-power=Basic power-plant components, air-cooled condensers for water recovery and exhaust stacks.
ipp-combined-cycle-power=Gas turbines whose hot exhaust raises steam for a second generation stage.
ipp-startup-energy-storage=Large-capacity reserve for black starts and controlled shutdowns.
ipp-pressurized-water-power=Three-circuit nuclear plant: a reactor core whose control rods follow circuit signals, an isolated primary loop, steam generation, a high-pressure turbine train, cooling, and spent-fuel cooling and storage. Replaces the vanilla nuclear reactor.
ipp-nuclear-reprocessing=Recover uranium and plutonium-bearing material from cooled spent fuel and vitrify the waste.

[fuel-category-name]
ipp-fuel-assembly=Fuel assembly

